  var OTHER_AFRICAN = ["en-ng", "en-ke", "en-gh", "en-tz", "en-zw"];

  // Word-boundary matches, so "Female" is never mistaken for "male".
  var MALE_RE = /\b(male|david|daniel|george|james|mark|fred|arthur|oliver|guy|ryan|thabo|sipho|will|alex|tom|liam|ravi|rishi|idris|gordon|sean|brian|luke|ethan|aaron|andrew|christopher|eric|jason|davis|tony|thomas|noah|wayne|connor|mitchell)\b/;
  var FEMALE_RE = /\b(female|zira|samantha|victoria|karen|susan|fiona|tessa|moira|veena|salli|joanna|kendra|kimberly|amy|emma|ivy|serena|allison|ava|siri|sara|linda|heera|leah|hazel|libby|sonia|maisie|natasha|clara|emily|jenny|aria|nova|mbali|zola)\b/;

  function voiceScore(v, gender){
    var name = (v.name || "").toLowerCase(), lang = normLang(v), s = 0;
    if (lang.indexOf("en") !== 0) return -1000;
    if (lang === "en-za") s += 500;
    else if (OTHER_AFRICAN.indexOf(lang) !== -1) s += 250;
    else if (lang === "en-gb") s += 40;
    else s += 30;
    if (/natural|neural|online|premium|enhanced/.test(name)) s += 80;
    if (/compact/.test(name)) s -= 20;
    var mine = gender === "female" ? FEMALE_RE : MALE_RE;
    var other = gender === "female" ? MALE_RE : FEMALE_RE;
    if (mine.test(name)) s += 300;
    if (other.test(name)) s -= 300;
    return s;
  }
  function pickAuto(gender){
    var best = null, bestScore = -Infinity;
    getVoices().forEach(function(v){
      var sc = voiceScore(v, gender);
      if (sc > bestScore){ bestScore = sc; best = v; }
    });
    return best;
  }
  function resolveVoice(choice, fallbackGender){
    if (!choice || choice === "same") return null;
    if (choice.indexOf("auto-") === 0) return pickAuto(choice === "auto-female" ? "female" : "male");
    var vs = getVoices();
    for (var i = 0; i < vs.length; i++){
      if (vs[i].voiceURI === choice || vs[i].name === choice) return vs[i];
    }
    return pickAuto(fallbackGender || "male");
  }

  // ----- turning text into spoken chunks -----
  function splitSentences(text){
    var out = [];
    var m = text.match(/[^.!?]+(?:[.!?]+["\u201d\u2019)]*|$)\s*/g) || [text];
    m.forEach(function(s){
      s = s.trim();
      while (s.length > 260){
        var cut = s.lastIndexOf(", ", 220);
        if (cut < 80) cut = s.lastIndexOf(" ", 220);
        if (cut < 80) cut = 220;
        out.push(s.slice(0, cut + 1).trim());
        s = s.slice(cut + 1).trim();
      }
      if (s && /[A-Za-z0-9]/.test(s)) out.push(s);
    });
    return out;
  }
  function textToChunks(text, startInQuote){
    var chunks = [], inQ = !!startInQuote, buf = "";
    function flush(){
      var t = buf.trim(); buf = "";
      if (!t) return;
      splitSentences(t).forEach(function(s){ chunks.push({ text: s, dialogue: inQ }); });
    }
    for (var i = 0; i < text.length; i++){
      var ch = text.charAt(i);
      if (ch === "\u201c"){ flush(); inQ = true; }
      else if (ch === "\u201d"){ flush(); inQ = false; }
      else buf += ch;
    }
    flush();
    return chunks;
  }
  function buildChunksForPage(pg, anchor, ctx){
    if (!pg) return [];
    var skipping = !!anchor && !ctx.started;
    if (pg.type === "cover"){
      if (skipping) return [];
      return [{ text: state.title + ".", dialogue: false }];
    }
    if (pg.type === "title"){
      if (skipping) return [];
      var parts = [state.title];
      if (state.subtitle) parts.push(state.subtitle);
      if (state.author) parts.push("By " + state.author);
      return parts.map(function(t){ return { text: /[.!?]$/.test(t) ? t : t + ".", dialogue: false }; });
    }
    if (pg.type === "end"){
      if (skipping) return [];
      return [{ text: "The End.", dialogue: false }];
    }
    if (pg.type === "frontispiece"){
      if (skipping) return [];
      var fv = [];
      FRONTISPIECE_VERSES.forEach(function(v){ splitSentences(v).forEach(function(x){ fv.push({ text: x, dialogue: false }); }); });
      return fv;
    }
    var out = [];
    pg.segs.forEach(function(sg){
      var from = sg.a;
      if (anchor && !ctx.started){
        if (sg.i === anchor.i && anchor.a >= sg.a && anchor.a < sg.b){ ctx.started = true; from = anchor.a; }
        else return;
      }
      var w = wordsOf(sg.i);
      var t = (from === sg.a) ? segText(sg) : w.slice(from, sg.b).join(" ");
      var startQ = false;
      if (from > 0){
        var prior = w.slice(0, from).join(" ");
        startQ = ((prior.match(/\u201c/g) || []).length - (prior.match(/\u201d/g) || []).length) > 0;
      }
      if (isHeading(BOOK_BODY_PARAS[sg.i]) || isSubtitle(BOOK_BODY_PARAS[sg.i])){
        if (!/[.!?:]$/.test(t)) t += ".";
      }
      out = out.concat(textToChunks(t, startQ));
    });
    return out;
  }
  // Everything in one view: one page, or both pages of a spread (left
  // first, then right). With an anchor, reading starts at that word.
  function buildChunksForViewAt(cur, anchor){
    var pgs;
    if (state.pageCount === 1) pgs = [state.pages[cur]];
    else { var pair = getDisplayedPair(cur); pgs = [pair.left, pair.right]; }
    if (anchor && !viewContainsAnchor(anchor)) anchor = null;
    var ctx = { started: !anchor }, out = [];
    pgs.forEach(function(pg){ out = out.concat(buildChunksForPage(pg, anchor, ctx)); });
    out.forEach(function(c){ c.v = cur; });
    return out;
  }
  function buildChunksForView(){ return buildChunksForViewAt(state.current, null); }

  // ----- speaking -----
  function updateNarrationButtons(){
    narrateBtn.innerHTML = narration.active ? "&#9209; Stop" : "&#128266; Read aloud";
    narrateBtn.classList.toggle("active", narration.active);
    pauseBtn.style.display = (hasSpeech && narration.active && !narration.preview) ? "" : "none";
    pauseBtn.innerHTML = narration.paused ? "&#9654; Resume" : "&#9208; Pause";
  }

  function utteranceFor(chunk, st){
    var u = new SpeechSynthesisUtterance(chunk.text);
    var voice = resolveVoice(st.narrator, "male");
    var pitch = st.pitch, rate = st.rate;
    if (chunk.dialogue){
      var dv = resolveVoice(st.dialogue, "female");
      if (dv){ voice = dv; rate = Math.min(1.5, rate + 0.03); }
      else { pitch = Math.min(2, pitch + 0.14); rate = Math.min(1.5, rate + 0.05); }
    }
    if (voice){ u.voice = voice; u.lang = voice.lang; } else { u.lang = "en-ZA"; }
    u.pitch = pitch; u.rate = rate;
    return u;
  }

  function stopNarration(){
    narration.active = false; narration.paused = false; narration.preview = false;
    narration.token++;
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch(e){}
    updateNarrationButtons();
  }

  // Speech is queued a few sentences ahead (and across page turns), so the
  // voice engine never stops and restarts between sentences or paragraphs.
  var AHEAD = 3;

  function extendChunks(){
    var guard = 0;
    while (narration.more && guard++ < 6){
      var t = computeTarget(narration.viewCur, 1, state.pageCount, state.pages.length);
      if (t === null){ narration.more = false; return false; }
      narration.viewCur = t;
      var add = buildChunksForViewAt(t, null);
      if (add.length){ narration.chunks = narration.chunks.concat(add); return true; }
    }
    return false;
  }

  function submitChunk(i){
    var tok = narration.token;
    var ch = narration.chunks[i];
    var u = utteranceFor(ch, narration.settings);
    u.onstart = function(){
      if (tok !== narration.token) return;
      narration.idx = i;
      if (!narration.preview && ch.v !== undefined && ch.v !== state.current){ state.current = ch.v; renderStatic(); }
      pump();
    };
    u.onend = function(){
      if (tok !== narration.token || !narration.active || narration.paused) return;
      if (narration.idx < i + 1) narration.idx = i + 1;
      pump();
    };
    u.onerror = function(e){
      if (tok !== narration.token) return;
      if (e && (e.error === "canceled" || e.error === "interrupted")) return;
      stopNarration();
    };
    try { window.speechSynthesis.speak(u); } catch(e){ stopNarration(); }
  }

  function pump(){
    while (narration.active && !narration.paused){
      if (narration.sub - narration.idx >= AHEAD) return;
      if (narration.sub >= narration.chunks.length){
        if (narration.preview || !narration.more || !extendChunks()) break;
        continue;
      }
      submitChunk(narration.sub++);
    }
    if (narration.active && !narration.paused &&
        narration.sub >= narration.chunks.length && narration.idx >= narration.chunks.length &&
        (narration.preview || !narration.more)) stopNarration();
  }

  function beginSpeaking(chunks, settings, isPreview){
    if (!hasSpeech) return;
    try { window.speechSynthesis.cancel(); } catch(e){}
    narration.token++;
    narration.settings = settings;
    narration.chunks = chunks;
    narration.idx = 0;
    narration.sub = 0;
    narration.viewCur = state.current;
    narration.more = !isPreview;
    narration.active = true;
    narration.paused = false;
    narration.preview = !!isPreview;
    updateNarrationButtons();
    setTimeout(pump, 80);
  }

  function pauseNarration(){
    if (!narration.active || narration.paused) return;
    narration.paused = true;
    narration.token++;
    try { window.speechSynthesis.cancel(); } catch(e){}
    updateNarrationButtons();
  }
  function resumeNarration(){
    if (!narration.active || !narration.paused) return;
    narration.paused = false;
    narration.sub = narration.idx;
    updateNarrationButtons();
    setTimeout(pump, 60);
  }
  pauseBtn.addEventListener("click", function(){
    if (narration.paused) resumeNarration(); else pauseNarration();
  });

  // ---------- Start reading where the reader puts the cursor ----------
  // Press and hold on any word (finger or mouse), or select some text, and
  // Read aloud starts from there. Holding a word while it is already
  // reading jumps the voice to that spot.
  var readFrom = null, noteEl = null, noteTimer = null, holdState = null, suppressClick = false;

  function showNote(msg){
    if (!noteEl){ noteEl = document.createElement("div"); noteEl.className = "read-note"; document.body.appendChild(noteEl); }
    noteEl.textContent = msg; noteEl.classList.add("show");
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function(){ noteEl.classList.remove("show"); }, 3200);
  }
  function clearReadMark(){
    readFrom = null;
    try { if (window.CSS && CSS.highlights) CSS.highlights.delete("readfrom"); } catch(e){}
  }
  function anchorFromNode(node, off){
    var el = node && (node.nodeType === 3 ? node.parentNode : node);
    var p = (el && el.closest) ? el.closest("p[data-i]") : null;
    if (!p || !p.closest("#underContent, #leftContent")) return null;
    var a0 = parseInt(p.getAttribute("data-a"), 10), i0 = parseInt(p.getAttribute("data-i"), 10);
    var text = p.textContent, w = 0, s0 = 0, e0;
    if (node.nodeType === 3 && node.parentNode === p){
      var o = Math.max(0, Math.min(off, text.length));
      w = (text.slice(0, o).match(/ /g) || []).length;
      s0 = o > 0 ? text.lastIndexOf(" ", o - 1) + 1 : 0;
      var sp = text.indexOf(" ", o); e0 = sp < 0 ? text.length : sp;
    } else { e0 = text.indexOf(" "); if (e0 < 0) e0 = text.length; }
    return { i: i0, a: a0 + w, p: p, s: s0, e: e0 };
  }
  function anchorAtPoint(x, y){
    var zones = document.querySelectorAll(".zone"), k, node = null, off = 0;
    for (k = 0; k < zones.length; k++) zones[k].style.pointerEvents = "none";
    try {
      if (document.caretPositionFromPoint){
        var cp = document.caretPositionFromPoint(x, y); if (cp){ node = cp.offsetNode; off = cp.offset; }
      } else if (document.caretRangeFromPoint){
        var r = document.caretRangeFromPoint(x, y); if (r){ node = r.startContainer; off = r.startOffset; }
      }
    } catch(e){}
    for (k = 0; k < zones.length; k++) zones[k].style.pointerEvents = "";
    return anchorFromNode(node, off);
  }
  function selectionAnchor(){
    try {
      var sel = window.getSelection();
      if (!sel || !sel.rangeCount || sel.isCollapsed) return null;
      var r = sel.getRangeAt(0);
      return anchorFromNode(r.startContainer, r.startOffset);
    } catch(e){ return null; }
  }
  function placeCursor(x, y){
    var an = anchorAtPoint(x, y);
    if (!an){ showNote("Press and hold on a word of the text to read from there."); return; }
    var snippet = wordsOf(an.i).slice(an.a, an.a + 5).join(" ");
    if (narration.active && !narration.preview){
      beginSpeaking(buildChunksForViewAt(state.current, an), narration.settings, false);
      showNote("Reading from \u201c" + snippet + "\u2026\u201d");
      return;
    }
    clearReadMark();
    readFrom = { i: an.i, a: an.a };
    try {
      if (window.CSS && CSS.highlights && window.Highlight){
        var rg = document.createRange();
        rg.setStart(an.p.firstChild, an.s); rg.setEnd(an.p.firstChild, an.e);
        CSS.highlights.set("readfrom", new Highlight(rg));
      }
    } catch(e){}
    showNote("Will read from \u201c" + snippet + "\u2026\u201d \u2014 now press Read aloud.");
  }

  narrateBtn.title = "Read aloud (press and hold a word first to start from there)";
  narrateBtn.addEventListener("click", function(){
    if (narration.active){ stopNarration(); return; }
    var an = selectionAnchor() || readFrom;
    if (an && !viewContainsAnchor(an)) an = null;
    var chunks = buildChunksForViewAt(state.current, an);
    if (!chunks.length) chunks = buildChunksForViewAt(state.current, null);
    clearReadMark();
    try { window.getSelection().removeAllRanges(); } catch(e){}
    beginSpeaking(chunks, loadVoiceSettings(), false);
  });

  (function wireHold(){
    var st = document.querySelector(".stage");
    if (!st) return;
    function cancelHold(){ if (holdState){ clearTimeout(holdState.t); holdState = null; } }
    st.addEventListener("pointerdown", function(e){
      if (e.pointerType === "mouse" && e.button !== 0) return;
      if (e.target.closest && e.target.closest("button, a, input, select")) return;
      cancelHold();
      var h = { x: e.clientX, y: e.clientY, fired: false };
      h.t = setTimeout(function(){ h.fired = true; suppressClick = true; placeCursor(h.x, h.y); }, 480);
      holdState = h;
    });
    st.addEventListener("pointermove", function(e){
      if (holdState && !holdState.fired && Math.abs(e.clientX - holdState.x) + Math.abs(e.clientY - holdState.y) > 12) cancelHold();
    });
    var endHold = function(){
      if (holdState && !holdState.fired) cancelHold(); else holdState = null;
      if (suppressClick) setTimeout(function(){ suppressClick = false; }, 350);
    };
    st.addEventListener("pointerup", endHold);
    st.addEventListener("pointercancel", endHold);
    st.addEventListener("contextmenu", function(e){ if (suppressClick) e.preventDefault(); });
  })();

  // ---------- Voice settings modal ----------
  var voiceSettingsBtn = $("voiceSettingsBtn");
  var voiceModalBackdrop = $("voiceModalBackdrop");
  var narratorSelect = $("narratorSelect"), dialogueSelect = $("dialogueSelect");
  var pitchRange = $("pitchRange"), pitchValue = $("pitchValue");
  var rateRange = $("rateRange"), rateValue = $("rateValue");
  var voiceStatus = $("voiceStatus");

  function voiceRank(v){
    var l = normLang(v);
    return l === "en-za" ? 0 : (OTHER_AFRICAN.indexOf(l) !== -1 ? 1 : 2);
  }
  function fillVoiceSelects(keepNarrator, keepDialogue){
    var all = getVoices();
    var list = all.filter(isEnglishVoice);
    if (!list.length) list = all.slice();
    list.sort(function(x, y){
      return (voiceRank(x) - voiceRank(y)) || normLang(x).localeCompare(normLang(y)) || (x.name || "").localeCompare(y.name || "");
    });
    function build(sel, first, current){
      sel.innerHTML = "";
      function add(value, label){
        var o = document.createElement("option"); o.value = value; o.textContent = label; sel.appendChild(o);
      }
      first.forEach(function(f){ add(f[0], f[1]); });
      list.forEach(function(v){
        add(v.voiceURI || v.name, (normLang(v) === "en-za" ? "\u2605 " : "") + v.name + " (" + (v.lang || "?") + ")");
      });
      var ok = false;
      for (var i = 0; i < sel.options.length; i++) if (sel.options[i].value === current) ok = true;
      sel.value = ok ? current : first[0][0];
    }
    build(narratorSelect, [["auto-male", "Automatic \u2014 male voice"], ["auto-female", "Automatic \u2014 female voice"]], keepNarrator);
    build(dialogueSelect, [["same", "Same as narrator (a little higher and livelier)"], ["auto-male", "Automatic \u2014 male voice"], ["auto-female", "Automatic \u2014 female voice"]], keepDialogue);
    updateVoiceStatus(all);
  }
  function describe(v){ return v ? v.name + " (" + v.lang + ")" : "the device default"; }
  function updateVoiceStatus(all){
    all = all || getVoices();
    if (!all.length){
      voiceStatus.textContent = "Voices are still loading \u2014 reopen this window in a moment if the lists look short.";
      return;
    }
    var hasZA = all.some(function(v){ return normLang(v) === "en-za"; });
    var nv = resolveVoice(narratorSelect.value, "male");
    var msg = "Narrator: " + describe(nv) + ".";
    if (hasZA) msg += " \u2605 marks South African English voices installed on this device.";
    else msg += " No South African English voice is installed on this device, so the closest English voice is used. Phones and computers can add one in their text-to-speech or speech settings (for example English \u2013 South Africa).";
    voiceStatus.textContent = msg;
  }

  try {
  if (voiceSettingsBtn){
    voiceSettingsBtn.addEventListener("click", function(){
      if (narration.active) stopNarration();
      var st = loadVoiceSettings();
      pitchRange.value = st.pitch; rateRange.value = st.rate;
      pitchValue.textContent = st.pitch.toFixed(2); rateValue.textContent = st.rate.toFixed(2);
      fillVoiceSelects(st.narrator, st.dialogue);
      voiceModalBackdrop.classList.add("open");
    });
    narratorSelect.addEventListener("change", function(){ updateVoiceStatus(); });
    pitchRange.addEventListener("input", function(){ pitchValue.textContent = parseFloat(pitchRange.value).toFixed(2); });
    rateRange.addEventListener("input", function(){ rateValue.textContent = parseFloat(rateRange.value).toFixed(2); });
    $("previewVoice").addEventListener("click", function(){
      beginSpeaking([
        { text: "She looked at him and said,", dialogue: false },
        { text: "We are not the in-between people. We are the bridge.", dialogue: true },
        { text: "And that is where the story begins.", dialogue: false }
      ], { narrator: narratorSelect.value, dialogue: dialogueSelect.value, pitch: parseFloat(pitchRange.value), rate: parseFloat(rateRange.value) }, true);
    });
    function closeVoice(){ if (narration.preview) stopNarration(); voiceModalBackdrop.classList.remove("open"); }
    $("cancelVoice").addEventListener("click", closeVoice);
    $("saveVoice").addEventListener("click", function(){
      lsSet(NARRATOR_KEY, narratorSelect.value);
      lsSet(DIALOGUE_KEY, dialogueSelect.value);
      lsSet(PITCH_PREF_KEY, pitchRange.value);
      lsSet(RATE_PREF_KEY, rateRange.value);
      closeVoice();
    });
    voiceModalBackdrop.addEventListener("click", function(e){ if (e.target === voiceModalBackdrop) closeVoice(); });
    if (window.speechSynthesis){
      // Voice lists load asynchronously in some browsers. The classic
      // onvoiceschanged property (not addEventListener) is used on purpose:
      // some mobile WebViews don't implement EventTarget on speechSynthesis.
      window.speechSynthesis.onvoiceschanged = function(){
        if (voiceModalBackdrop.classList.contains("open")) fillVoiceSelects(narratorSelect.value, dialogueSelect.value);
      };
    }
  }
  } catch(e){}

  // Shrinks the opening scripture just enough to sit fully inside its
  // gold border, whatever the page size.
  function fitFrontispieces(){
    var frames = document.querySelectorAll(".frontispiece-frame");
    for (var f = 0; f < frames.length; f++){
      var frame = frames[f], text = frame.querySelector(".frontispiece-text");
      if (!text || !frame.clientHeight) continue;
      var cs = getComputedStyle(frame);
      var avail = frame.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      var size = 17;
      text.style.fontSize = size + "px";
      while (size > 10 && text.offsetHeight > avail){ size -= 0.5; text.style.fontSize = size + "px"; }
    }
  }

  // ---------- Render (static, no animation) ----------
  function renderStatic(){
    clearReadMark();
    var pages = state.pages;
    var cur = state.current;

    if (state.pageCount === 1){
      var only = pages[cur];
      var m = pageMarkup(only);
      underContent.className = "page-content" + pageTypeClass(only);
      underContent.innerHTML = m.content;
      underFolio.textContent = m.folio;
      leftContent.innerHTML = "";
      leftFolio.textContent = "";
    } else {
      var pair = getDisplayedPair(cur);

      var l = pageMarkup(pair.left);
      leftContent.className = "page-content" + pageTypeClass(pair.left);
      leftContent.innerHTML = l.content;
      leftFolio.textContent = l.folio;

      var r = pageMarkup(pair.right);
      underContent.className = "page-content" + pageTypeClass(pair.right);
      underContent.innerHTML = r.content;
      underFolio.textContent = r.folio;
    }

    flipLeaf.classList.remove("animating");
    flipLeaf.style.transform = "rotateY(0deg)";
    flipLeaf.style.visibility = "hidden";
    frontContent.innerHTML = ""; backContent.innerHTML = "";
    frontFolio.textContent = ""; backFolio.textContent = "";

    fitFrontispieces();
    updateChrome();
  }

  function updateChrome(){
    var total = state.pages.length;
    var cur = state.current;
    progressLabel.textContent = Math.min(cur + 1, total) + " / " + total;
    progressFill.style.width = (total > 1 ? (cur / (total - 1)) * 100 : 0) + "%";
    ribbon.style.right = (46 + (cur / Math.max(1, total - 1)) * 160) + "px";
    $("prevBtn").disabled = computeTarget(cur, -1, state.pageCount, total) === null;
    $("nextBtn").disabled = computeTarget(cur, 1, state.pageCount, total) === null;
    var announcer = $("pageAnnouncer");
    if (announcer) announcer.textContent = "Page " + Math.min(cur + 1, total) + " of " + total;
    onViewChanged();
  }

  // ---------- Turning the page ----------
  // Two-page mode turns like a real book: a 3D flip of the right-hand leaf.
  // One-page mode reads more like a webpage: a quick, calm cross-fade —
  // no theatrical flip — so continuous reading feels light and natural
  // while the page itself keeps its rounded, book-like frame.
  function goNext(){ flip(1); }
  function goPrev(){ flip(-1); }

  function flip(direction){
    if (state.animating) return;
    var pages = state.pages;
    var cur = state.current;
    var target = computeTarget(cur, direction, state.pageCount, pages.length);
    if (target === null) return;

    if (narration.active) stopNarration();

    var osReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (state.pageCount === 1){
      if (osReducedMotion){
        state.current = target;
        renderStatic();
        return;
      }
      state.animating = true;
      rightPageUnderEl.style.opacity = "0";
      window.setTimeout(function(){
        state.current = target;
        renderStatic();
        rightPageUnderEl.style.opacity = "1";
        state.animating = false;
      }, 170);
      return;
    }

    if (osReducedMotion){
      state.current = target;
      renderStatic();
      return;
    }

    state.animating = true;
    flipLeaf.classList.remove("animating");
    flipLeaf.style.visibility = "visible";

    // Two-page spread: turning reveals a whole new pair, just like a real
    // book. The left page swaps instantly (no animation); the right page
    // is what visibly flips, from the old right page to the new one.
    var oldPair = getDisplayedPair(cur);
    var newPair = getDisplayedPair(target);

    var lm = pageMarkup(newPair.left);
    leftContent.className = "page-content" + pageTypeClass(newPair.left);
    leftContent.innerHTML = lm.content;
    leftFolio.textContent = lm.folio;

    var mFront = pageMarkup(oldPair.right);
    var mBack = pageMarkup(newPair.right);
    frontContent.className = "page-content" + pageTypeClass(oldPair.right);
    frontContent.innerHTML = mFront.content;
    frontFolio.textContent = mFront.folio;
    backContent.className = "page-content" + pageTypeClass(newPair.right);
    backContent.innerHTML = mBack.content;
    backFolio.textContent = mBack.folio;

    underContent.className = "page-content" + pageTypeClass(newPair.right);
    underContent.innerHTML = mBack.content;
    underFolio.textContent = mBack.folio;
    fitFrontispieces();

    if (direction === 1){
      flipLeaf.style.transform = "rotateY(0deg)";
      void flipLeaf.offsetWidth;
      flipLeaf.classList.add("animating");
      flipLeaf.style.transform = "rotateY(-180deg)";
    } else {
      flipLeaf.style.transform = "rotateY(-180deg)";
      void flipLeaf.offsetWidth;
      flipLeaf.classList.add("animating");
      flipLeaf.style.transform = "rotateY(0deg)";
    }

    var done = function(e){
      if (e && e.target !== flipLeaf) return;
      flipLeaf.removeEventListener("transitionend", done);
      state.current = target;
      state.animating = false;
      renderStatic();
    };
    flipLeaf.addEventListener("transitionend", done);
  }

  // ---------- Page-layout mode (1 page / 2 page) ----------
  function currentAnchor(){
    var idx = state.current, p = state.pages[idx];
    if (!p) return { special: 0 };
    if (p.type === "content") return { i: p.segs[0].i, a: p.segs[0].a };
    if (p.type === "end") return { special: "end" };
    return { special: idx };
  }
  function indexForAnchor(an){
    var pages = state.pages;
    if (an.special === "end") return pages.length - 1;
    if (an.special !== undefined) return Math.min(an.special, pages.length - 1);
    for (var x = 0; x < pages.length; x++){
      var pg = pages[x];
      if (pg.type !== "content") continue;
      for (var y = 0; y < pg.segs.length; y++){
        var sg = pg.segs[y];
        if (sg.i === an.i && an.a >= sg.a && an.a < sg.b) return x;
        if (sg.i > an.i) return x;
      }
    }
    return pages.length - 1;
  }
  function mapIndexForMode(idx, n){
    if (n === 1) return idx;
    return idx <= 0 ? 0 : (idx % 2 === 1 ? idx : idx - 1);
  }

  function applyModeVars(n){
    var c = n === 1 ? SINGLE : DOUBLE;
    var rs = document.documentElement.style;
    rs.setProperty("--page-count", n);
    rs.setProperty("--page-w", c.w + "px");
    rs.setProperty("--page-h", c.h + "px");
    rs.setProperty("--pad-x", c.px + "px");
    rs.setProperty("--pad-top", c.pt + "px");
    rs.setProperty("--pad-bottom", c.pb + "px");
    rs.setProperty("--content-font-size", c.fs + "px");
    rs.setProperty("--content-line-height", c.lh);
    leavesArea.classList.toggle("single-page-mode", n === 1);
    bookEl.classList.toggle("single-page-mode", n === 1);
    $("onePageBtn").classList.toggle("active", n === 1);
    $("twoPageBtn").classList.toggle("active", n === 2);
    $("onePageBtn").setAttribute("aria-pressed", n === 1 ? "true" : "false");
    $("twoPageBtn").setAttribute("aria-pressed", n === 2 ? "true" : "false");
  }

  function setPageCount(n){
    if (n === state.pageCount) return;
    if (narration.active) stopNarration();
    // The text re-flows at a different page size, so remember where the
    // reader is in the text (not the page number) and come back to it.
    var anchor = currentAnchor();
    state.pageCount = n;
    lsSet(MODE_KEY, String(n));
    applyModeVars(n);
    paginate();
    state.current = mapIndexForMode(indexForAnchor(anchor), n);
    renderStatic();
    rescale();
  }

  // ---------- Last-read position and bookmark ----------
  // Where you stop reading is remembered automatically, so the book opens
  // on that page next time. The Bookmark button keeps one extra marker you
  // can jump back to from the Go to window.
  var restored = false;
  var bookmarkBtn = $("bookmarkBtn");

  function loadAnchor(key){
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return null;
      var a = JSON.parse(raw);
      if (a && typeof a.i === "number" && typeof a.a === "number") return a;
    } catch(e){}
    return null;
  }
  function saveAnchor(key, a){
    try { if (a) localStorage.setItem(key, JSON.stringify(a)); else localStorage.removeItem(key); } catch(e){}
  }
  function visiblePages(){
    if (state.pageCount === 1) return [state.pages[state.current]];
    var pair = getDisplayedPair(state.current);
    return [pair.left, pair.right];
  }
  function readingAnchor(){
    var v = visiblePages();
    for (var x = 0; x < v.length; x++){
      if (v[x] && v[x].type === "content") return { i: v[x].segs[0].i, a: v[x].segs[0].a };
    }
    return null;
  }
  function viewContainsAnchor(an){
    var v = visiblePages();
    for (var x = 0; x < v.length; x++){
      var pg = v[x];
      if (!pg || pg.type !== "content") continue;
      for (var y = 0; y < pg.segs.length; y++){
        var sg = pg.segs[y];
        if (sg.i === an.i && an.a >= sg.a && an.a < sg.b) return true;
      }
    }
    return false;
  }
  function updateBookmarkBtn(){
    var bm = loadAnchor(BOOKMARK_KEY);
    var on = !!(bm && viewContainsAnchor(bm));
    bookmarkBtn.classList.toggle("active", on);
    bookmarkBtn.innerHTML = on ? "&#128278; Bookmarked" : "&#128278; Bookmark";
    bookmarkBtn.title = on ? "Click to remove this bookmark" : "Bookmark this page";
  }
  function onViewChanged(){
    if (!restored) return;
    var a = readingAnchor();
    if (a) saveAnchor(LASTPOS_KEY, a);
    updateBookmarkBtn();
  }
  bookmarkBtn.addEventListener("click", function(){
    var bm = loadAnchor(BOOKMARK_KEY);
    if (bm && viewContainsAnchor(bm)) saveAnchor(BOOKMARK_KEY, null);
    else saveAnchor(BOOKMARK_KEY, readingAnchor() || { i: 0, a: 0 });
    updateBookmarkBtn();
  });

  // ---------- Go to a page / chapter ----------
  var gotoModalBackdrop = $("gotoModalBackdrop");
  var gotoInput = $("gotoInput"), chapterSelect = $("chapterSelect"), gotoStatus = $("gotoStatus");

  function goToIndex(t){
    if (state.animating) return;
    t = Math.max(0, Math.min(state.pages.length - 1, t));
    if (narration.active) stopNarration();
    state.current = mapIndexForMode(t, state.pageCount);
    renderStatic();
  }
  function openGoto(){
    if (narration.active) stopNarration();
    $("gotoTotal").textContent = state.pages.length;
    gotoInput.max = state.pages.length;
    gotoInput.value = Math.min(state.current + 1, state.pages.length);
    gotoStatus.textContent = ""; gotoStatus.classList.remove("error");
    chapterSelect.innerHTML = '<option value="">Choose a chapter\u2026</option>';
    state.chapters.forEach(function(c){
      var o = document.createElement("option");
      o.value = c.idx; o.textContent = c.title + "  (p. " + (c.idx + 1) + ")";
      chapterSelect.appendChild(o);
    });
    var bm = loadAnchor(BOOKMARK_KEY), gbb = $("gotoBookmarkBtn");
    if (bm){
      gbb.style.display = "";
      gbb.innerHTML = "&#128278; Go to my bookmark (page " + (indexForAnchor(bm) + 1) + ")";
    } else {
      gbb.style.display = "none";
    }
    gotoModalBackdrop.classList.add("open");
    setTimeout(function(){ gotoInput.focus(); gotoInput.select(); }, 30);
  }
  function submitGoto(){
    var n = parseInt(gotoInput.value, 10);
    if (!isFinite(n) || n < 1 || n > state.pages.length){
      gotoStatus.classList.add("error");
      gotoStatus.textContent = "Enter a page between 1 and " + state.pages.length + ".";
      return;
    }
    gotoModalBackdrop.classList.remove("open");
    goToIndex(n - 1);
  }
  $("gotoBtn").addEventListener("click", openGoto);
  $("gotoBookmarkBtn").addEventListener("click", function(){
    var bm = loadAnchor(BOOKMARK_KEY);
    if (!bm) return;
    gotoModalBackdrop.classList.remove("open");
    goToIndex(indexForAnchor(bm));
  });
  $("doGoto").addEventListener("click", submitGoto);
  $("cancelGoto").addEventListener("click", function(){ gotoModalBackdrop.classList.remove("open"); });
  gotoInput.addEventListener("keydown", function(e){ if (e.key === "Enter"){ e.preventDefault(); submitGoto(); } });
  chapterSelect.addEventListener("change", function(){
    if (chapterSelect.value === "") return;
    gotoModalBackdrop.classList.remove("open");
    goToIndex(parseInt(chapterSelect.value, 10));
  });
  gotoModalBackdrop.addEventListener("click", function(e){
    if (e.target === gotoModalBackdrop) gotoModalBackdrop.classList.remove("open");
  });

  $("onePageBtn").addEventListener("click", function(){ setPageCount(1); });
  $("twoPageBtn").addEventListener("click", function(){ setPageCount(2); });

  // ---------- Scaling to viewport ----------
  var stageEl = document.querySelector(".stage");

  function rescale(){
    var cfg = state.pageCount === 1 ? SINGLE : DOUBLE, pageW = cfg.w, pageH = cfg.h;
    var bookW = pageW * state.pageCount + 56 + 56;
    var bookH = pageH + 48 + 80;
    var availW = window.innerWidth - 60;
    var availH = window.innerHeight - 120;
    var scale = Math.min(availW / bookW, availH / bookH, 1.1);
    state.fitScale = Math.max(0.3, scale);
    applyScale();
  }
  function applyScale(){
    var combined = state.fitScale * state.zoom;
    document.documentElement.style.setProperty("--scale", combined);
    stageEl.classList.toggle("zoomed", state.zoom > 1.001);
  }
  function setZoom(next){
    state.zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, next));
    applyScale();
    updateZoomChrome();
  }
  function updateZoomChrome(){
    $("zoomMinus").disabled = state.zoom <= ZOOM_MIN + 0.001;
    $("zoomPlus").disabled = state.zoom >= ZOOM_MAX - 0.001;
  }

  // ---------- Events ----------
  $("nextBtn").addEventListener("click", goNext);
  $("prevBtn").addEventListener("click", goPrev);
  function zoneClick(handler){
    return function(){
      if (suppressClick){ suppressClick = false; return; }
      if (window.getSelection().toString().length > 0) return;
      handler();
    };
  }
  $("zoneNext").addEventListener("click", zoneClick(goNext));
  $("zonePrev").addEventListener("click", zoneClick(goPrev));

  document.addEventListener("keydown", function(e){
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    if (document.querySelector(".modal-backdrop.open")) return;
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); goNext(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); goPrev(); }
  });

  window.addEventListener("resize", rescale);
  $("zoomMinus").addEventListener("click", function(){ setZoom(state.zoom - ZOOM_STEP); });
  $("zoomPlus").addEventListener("click", function(){ setZoom(state.zoom + ZOOM_STEP); });
  $("zoomReset").addEventListener("click", function(){ setZoom(1); stageEl.scrollTop = 0; stageEl.scrollLeft = 0; });
  stageEl.addEventListener("wheel", function(e){
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    setZoom(state.zoom + (e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP));
  }, { passive: false });

  // ---------- Cover gate (closed book) ----------
  var coverGate = $("coverGate");
  coverGate.addEventListener("click", function(){
    coverGate.style.display = "none";
  });

  // ---------- Access gate ----------
  var lockScreen = $("lockScreen");
  var lockInput = $("lockInput");
  var lockError = $("lockError");
  var unlockBtn = $("unlockBtn");
  var lockDevNote = $("lockDevNote");
  $("lockBuyLink").href = BUY_PAGE_URL;

  function grantAccess(){ lockScreen.style.display = "none"; }

  function attemptUnlock(key){
    lockError.textContent = "";
    unlockBtn.disabled = true;
    unlockBtn.textContent = "Checking\u2026";
    fetch(ACCESS_CHECK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ license_key: key })
    }).then(function(res){ return res.json(); })
      .then(function(data){
        unlockBtn.disabled = false;
        unlockBtn.textContent = "Unlock my book";
        if (data && data.valid){
          try { localStorage.setItem(STORAGE_KEY, key); } catch(e){}
          grantAccess();
        } else {
          lockError.textContent = "That key doesn't look right \u2014 check for typos, or use the key from your purchase email.";
        }
      })
      .catch(function(){
        unlockBtn.disabled = false;
        unlockBtn.textContent = "Unlock my book";
        lockError.textContent = "Couldn't reach the access check right now. Please try again in a moment.";
      });
  }
  unlockBtn.addEventListener("click", function(){
    var key = lockInput.value.trim();
    if (!key){ lockError.textContent = "Enter your access key first."; return; }
    attemptUnlock(key);
  });
  lockInput.addEventListener("keydown", function(e){ if (e.key === "Enter") unlockBtn.click(); });

  (function initGate(){
    if (DEV_MODE){
      lockDevNote.style.display = "block";
      lockDevNote.textContent = "Dev mode: no worker URL is set yet, so this screen isn't gating anything.";
      grantAccess();
      return;
    }
    var stored = null;
    try { stored = localStorage.getItem(STORAGE_KEY); } catch(e){}
    if (stored){ grantAccess(); return; }
    var urlKey = new URLSearchParams(window.location.search).get("key");
    if (urlKey){
      lockInput.value = urlKey;
      attemptUnlock(urlKey);
    }
  })();

  // ---------- Init ----------
  $("brandTitle").textContent = state.title;
  if (!hasSpeech){ narrateBtn.style.display = "none"; pauseBtn.style.display = "none"; if (voiceSettingsBtn) voiceSettingsBtn.style.display = "none"; }
  if (parseInt(lsGet(MODE_KEY), 10) === 1) state.pageCount = 1;
  applyModeVars(state.pageCount);
  rescale();
  updateZoomChrome();

  // Wait for the actual book font to finish loading (and for the browser to
  // have actually painted with it) before measuring pages — pagination run
  // too early, or against a font that hasn't visually taken effect yet,
  // locks in wrong measurements, especially in mobile WebViews.
  loadingNote.style.display = "block";

  function runPaginationWhenReady(){
    function afterTwoFrames(cb){
      requestAnimationFrame(function(){ requestAnimationFrame(cb); });
    }
    afterTwoFrames(function(){
      paginate();
      var saved = loadAnchor(LASTPOS_KEY);
      if (saved) state.current = mapIndexForMode(indexForAnchor(saved), state.pageCount);
      renderStatic();
      restored = true;
      if (saved && state.current > 2){
        $("coverHint").textContent = "Tap to continue reading \u00b7 page " + (state.current + 1);
      }
    });
  }

  if (document.fonts && document.fonts.load){
    Promise.all([
      document.fonts.load('400 18px "Libre Caslon Text"'),
      document.fonts.load('700 18px "Libre Caslon Text"'),
      document.fonts.load('italic 400 18px "Libre Caslon Text"')
    ]).catch(function(){ /* fall through even if a variant fails to load */ })
      .then(function(){
        if (document.fonts.ready){
          document.fonts.ready.then(runPaginationWhenReady);
        } else {
          runPaginationWhenReady();
        }
      });
  } else {
    runPaginationWhenReady();
  }

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
