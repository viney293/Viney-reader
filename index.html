    "I see race because I am part of the Coloured identity\u2019s racial crisis, one with roots far deeper than gangsterism and drugs. The issues facing the Coloured and Khoisan people are not self-made. They are historical, systemic, and deeply racialised. We have been victims of undignified stereotypes, seen as cognitively unfit to lead, prone to violence, and treated with quiet contempt.",
    "As long as a DA mayor carries on with clownish gimmicks, painting over poverty with pastel colours in under-serviced communities and baking samosas with Coloured aunties, while children the same age as him grind away in underpaid jobs that don\u2019t come close to his salary and his privilege, I will remain in a world of reality that no status of liberalism can make believe isn\u2019t real, should be ignored, or should be excused. Not because of envy. Because I know what they are doing. My obsession is not accidental. It is rooted in knowledge.",
    "There are far too many among us who are so obsessed with becoming liberal, while belonging to an identity that has not yet reached liberation, who still pretend to be \u201cjust South African,\u201d or \u201cjust human,\u201d and who refuse to see themselves as Coloured, despite the fact that everything about our lives, legally and socially, is defined, stereotyped, and deprived, because we are Coloured.",
    "Too many of us are politically sharp but historically blind, too proud to admit that the dysfunction in our Coloured communities, and the rot in government, is not simply a result of Black incompetence, but a continuation of chaos engineered long ago. We used to fight those origins. Now we pretend they don\u2019t still exist.",
    "You speak politics like someone who jumped into the middle of a story, never knowing how it started. You crave being seen as liberal, and fear being called racist, so much so that even when you witness racism, you whisper about it, as if you were the criminal instead of the victim.",
    "And after all of that, after all the status-chasing, the business breaks from white friends, the houses in Constantia and Bishopscourt, the international business trips, the career promotions, the rise as IT moguls, not one of you has built generational wealth. Not one of you owns land en masse. Not one of you holds capital power, rooted in ownership and legacy. Not a single one.",
    "So no, don\u2019t come and tell me to tone it down. I see race, because it still decides who eats, who starves, who leads, and who follows.",
    "Why There Is Everything Wrong, Yet Not a Single Thing Wrong, About a Coloured Person Voting DA",
    "Read this section carefully before you decide what I\u2019m saying. If, once you\u2019ve read it, your honest summary is that I believe it is a normal, natural, unashamed thing for a Coloured person to vote DA, even knowing full well that Coloured development and empowerment is not that party\u2019s priority, then yes, that is exactly what I\u2019m saying. Not because the DA deserves that vote. Because of what that vote actually represents, and what it exposes.",
    "Here is the political fact, plain and checkable, that this argument rests on. The DA was built from a merger: the old Democratic Party, largely English-speaking white liberals, the remnants of the National Party, and the Independent Democrats, whose base was overwhelmingly Coloured. From that merger onward, Coloured and Khoisan voters have made up the DA\u2019s largest racial constituency by number, exceeding the white liberal base that founded it. The Western Cape, the DA\u2019s flagship province, the one it points to as proof of good governance, is governed on the back of that Coloured vote and staffed, at the administrative level, overwhelmingly by Coloured hands. When the DA is praised for running the best-administered province in the country, that praise is describing Coloured competence. It is simply being collected by someone else.",
    "So here is the wrong, and it has nothing to do with the act of voting. The wrong is that this reality goes unclaimed. We deliver the numbers, the loyalty, and the administrative discipline that makes the party functional, and in return we get a handful of Coloured faces on posters while a minority white leadership keeps the policy pen, decides which Western ideologies get imported, and is credited, in the public imagination, with a competence that is not actually theirs to claim. That image, English fluency, tailored suits, a certain performance of \u201cgreat leadership\u201d, is doing a lot of work to obscure who is actually carrying the party. That is the delusion. Not the vote. The theft of credit for what the vote has already proven.",
    "And here is the part not a single thing is wrong with: the ambition underneath it. There is nothing shameful about wanting power, wanting a well-run place to live, wanting stability, wanting to be part of something that actually governs competently. We have already proven, inside this very party, that we can do all of that at scale. The DA\u2019s success is, in truth, one of the largest demonstrations of Coloured political unity and administrative capability this country has ever produced. We keep telling each other we lack the ability to unite, to organise, to govern. We are the evidence against our own doubt, we simply built someone else\u2019s legacy while doing it.",
    "So an ordinary Coloured voter who votes DA, clear-eyed about all of this, is not betraying anyone. They are recognising, whether they say it in these terms or not, where the competence in that party actually sits. The betrayal is something narrower, and it belongs to a different group of people: Coloured political leaders who leave genuine, grassroots Coloured movements to join the DA without ever grounding themselves in the actual political science of what they\u2019re walking into, without a plan to convert our proven numerical and administrative power into policy we actually hold. That is not ambition. That is trading resistance for the illusion of progress.",
    "A Letter to a Young Politician",
    "I have always been a sucker for young people with real passion for politics, young leaders with ability, ambition, and the will to change things. I remember one such young man, and how, despite his youth, he carried the spirit of someone who wanted to be part of a genuine Coloured initiative, a movement built to politically mobilise around our people\u2019s dilemmas and injustices. I saw how he positioned himself alongside serious Coloured activists, ready to confront the exact worries trapping our communities, our children, our politics, our reputation, our identity, our integrity.",
    "Then he joined the DA, and posted a photograph of a park the city\u2019s tractors had just cleaned, presented as proof of tireless work for the people. Let me tell him what I see as good in that choice, and why, at the same time, it disappointed those of us who have spent years in this fight.",
    "The good is that the choice proves something real: a healthy political ambition, a hunger for power, for a vehicle to carry a cause, for people equally committed to stand beside him. That hunger is genuine. Only someone who still remembers what dignity in our communities used to look like would feel proud enough to post a photograph like that one.",
    "The bad is where too many of our political spirits fall, and where every Coloured politician\u2019s migration to the DA has changed nothing. Too many of us step into politics knowing the wounds but never grounding ourselves in the systems, ideologies, and history that actually shape this world. Without that grounding, the fight cannot be equal. Without it, politics becomes performance, not resistance. The world\u2019s political systems are not neutral. They are built to manage and weaken exactly the communities most people in them come from. Without understanding that as a science, you end up trapped inside the very system you believe you are changing.",
    "So the choice to join the DA, his and every more senior politician\u2019s before him, became a betrayal, not because ambition is wrong, but because it exchanged genuine politics for the illusion of progress. He stood in a place where he could have helped build resistance, and instead stepped into a party whose policies he already knew have long worked against our communities\u2019 dignity and survival.",
    "I can say without fear: there is no better choice of party for Coloured people to join or vote for than the DA, not because it deserves us, but because we are already, in numbers and in competence, its foundation. I say this with the political education and the facts to defend it, facts that, properly understood, are the strongest argument there is, not for loyalty to that party, but for finally claiming, consciously, what we have already built inside it.",
    "Why It Worked",
    "Both parties relied on divide and rule. The ANC said: you\u2019re not Black enough. The DA said: at least we\u2019re not the ANC. So we voted out of fear, not vision. We stayed loyal to parties that weren\u2019t loyal to us. We celebrated being tolerated. And our reward was townships that became war zones, schools stripped of real funding, youth without purpose stuck in trauma, and leaders who became tokens or traitors.",
    "Our Own Silence",
    "This part hurts, but it has to be said: we allowed it. We let gang bosses speak louder than teachers, pastors preach silence instead of justice, ward councillors buy us with food parcels, artists entertain instead of educate, elders tell us to \u201cjust be grateful.\u201d We sold our vote for peace. We traded our pain for permission. We chose loyalty over liberation. That ends now.",
    "The Blueprint for Political Reclamation",
    "We don\u2019t need more parties. We need purpose. Narrative control, stop waiting for the media to tell our story; write it, film it, teach it. Youth activation, train our young people in leadership, media, policy, and technology, so they become the narrators, not the next victims. Local government takeover, target municipal and ward elections, build independent slates of credible community organisers instead of careerists, and end DA/ANC domination by default. National alliance building, form a Coloured bloc across the country, not to isolate ourselves but to negotiate power, because politics is numbers and leverage, not loyalty. Civic intelligence, run political education forums that prepare rather than just protest, teaching the constitution, budget laws, and public access rights. Knowledge is power, and we\u2019ve been deliberately undereducated.",
    "The Final Line in the Sand",
    "If we do not claim our power now, the next generation will curse us for our cowardice. We don\u2019t need permission to lead. We need conviction. We don\u2019t need pity. We need pride. And we don\u2019t need a better party. We need a political rebirth.",
    "Chapter 15: How We Lost Our Soul and How We Rebuild It, Identity Through Art, Memory, and Storytelling",
    "They didn\u2019t just take our land. They didn\u2019t just rob our economy. They stole something deeper, our mirror. They made us forget what we looked like, what we sounded like, what we cooked, danced, prayed, painted, believed, built. They bombed our culture in silence, not with warplanes but with erasure. And now we stand in the ruins of a Coloured identity we didn\u2019t author, only inherited: broken, blamed, unfinished. But we will finish it now.",
    "The Silent Cultural Genocide",
    "Under apartheid, they labelled us \u201cColoured\u201d, a name without history, without language, without honour, a box for neither Black nor White, a convenience for categorisation. So our grandparents made do: made music with pain, danced in defiance, told stories in secret, survived loud and shameful and proud. Under the new regime, something changed. We weren\u2019t just oppressed, we were forgotten. Our art wasn\u2019t funded. Our museums weren\u2019t built. Our dialects weren\u2019t respected. Our heroes weren\u2019t taught. We became entertainment, not educators. They loved our slang but not our science, cheered our comedy but ignored our politics, played our songs but silenced our stories. That\u2019s not a culture. It\u2019s a cage.",
    "Cultural Amnesia Is Designed to Keep You Powerless",
    "If you don\u2019t know who you are, you\u2019ll believe anything about yourself. And what did they tell us, that we\u2019re gangsters by nature, alcoholics by tradition, good for labour but not leadership, angry because we\u2019re broken? That story was embedded in textbooks, sitcoms, political speeches, police reports, church sermons. We were programmed to hate our own reflection. Our daughters stopped wearing their natural curls. Our sons performed toughness to survive. They told us we had no culture, and we believed it.",
    "But We Do Have a Culture. We Just Haven\u2019t Owned It.",
    "Our culture is not in museums. It\u2019s alive, in the way we mix languages like jazz riffs, the way we walk into rooms like they\u2019re stages, the food that holds five histories on one plate, the humour that cuts like a blade and heals like balm, the stories that begin with \u201cjy weet mos\u201d and end in wisdom. We descend from Khoisan bloodlines, Malay resistance, slave revolutions, European rebellions, African survival, Cape Town rhythm, global mutation. We are cultural alchemists, we take broken things and make them beautiful. But only if we own it.",
    "Rebuilding Is Strategic, Not Cosmetic",
    "Culture isn\u2019t soft power. It is the foundation of all power. You can\u2019t build politics without identity, economics without dignity, or raise children without stories. Culture is not decoration. It\u2019s declaration. So we rebuild it like this: retell our origins, teach our kids that we are not the product of rape and apartheid, but the survivors of it, a new synthesis of race, resilience, and renewal. Fund our artists, stop waiting for government, start community art trusts, storytelling circles, youth theatres; turn our elders into archives, our dancers into diplomats, our poets into policymakers. Protect our language, formalise Kaaps, our slang, our hybrid tones; write it, teach it, publish it, so our children hear their truth in the classroom, not just the playground. Claim our memory, build local museums, digitise our family stories, document our rebellions, celebrate the struggle of our own parents, not only Mandela\u2019s.",
    "From Pain to Pride",
    "Coloured youth are not just addicted to drugs. They are addicted to self-erasure, because pain with no story becomes poison. Culture is the antidote. When a child sees themselves as the protagonist, they act differently. When a father hears his music respected, he walks differently. When a community reads its own truth in books, it rises differently.",
    "Culture Is the Soul of Liberation",
    "We will not beg for recognition. We will not wait for permission. We are the storytellers now, because whoever controls the story controls the future, and we are done being background characters in someone else\u2019s version of South Africa.",
    "Chapter 16: The Collective Coloured Consciousness",
    "Without a shared awareness of who we are, what we have survived, and what we are still owed, unity is a word without a foundation. This chapter is about that foundation: becoming Coloured conscious, redefining and retelling our own narrative of who we are, where we come from, and why we need to be respected, as a new breed of Southern African Natives, as South Africans, as Africans, and not as non-humans, not as people without culture, but as human beings in full.",
    "Unity chased for political might alone is not unity. In reality it is a domination strategy dressed up as a righteous means to gain power. Real unity does not start with a vote or a party. It starts with consciousness. And consciousness is what ends, eventually, in power.",
    "Defined by Everyone but Ourselves",
    "Who we are as people of mixed origin, as Coloured people, what we are, what we are capable of, and how we see and relate to each other, has historically always been shaped, manipulated, and controlled by those who felt entitled to define us.",
    "For generations, outsiders have labelled us, boxed us in, and imposed their versions of our identity onto us. Black South Africans have often viewed Coloured people as too genetically mixed, too culturally fragmented, to be worthy of traditional or indigenous belonging. White South Africans, on the other hand, have taken full advantage of our loyalty, our spiritual devotion, and the insecurities passed down from generations of survival, using our silence and our service to reinforce their privilege.",
    "This is why our Collective Coloured Consciousness has been so corroded, stifled, and stereotypically defined by everyone in our history, except us.",
    "Becoming politically conscious and self-aware is how we reclaim the right to define ourselves, trust ourselves, and liberate ourselves from the grip of labels imposed by others. We must become resistant, and no longer allow anyone, Black or White, to tell us who we are.",
    "When Silence Becomes Betrayal",
    "There comes a time when silence, ignorance, and plain denial become betrayal, and for Coloured people in South Africa, that time is long overdue.",
    "The truth is, many of us have gone beyond just betraying ourselves. We have betrayed the children of our people, who carry our identities while sitting unemployed, filling our prisons, carrying our reputations. We have convinced ourselves we are doing fine, that we are progressing, in our jobs, our careers, our small businesses, our suburban homes. But those illusions of progress have blinded us to a deeper truth: we have gone nowhere, just as slowly as the children stuck in our forgotten, dysfunctional Coloured communities.",
    "All of us, no matter how rich, educated, or socially affluent, our lives still reflect the harsh reality we refuse to face. We have failed to build structures to protect our own. We have failed to create alternatives. We have failed to see that individual success can mask a collective decline. Go and search for it yourself: there is no list of generationally wealthy Coloured families. Not because we lack potential, but because we have stagnated, locked out of systems designed to keep others on top, and us dependent, divided, and distracted.",
    "Protect Your Own, Fund Your Own, Defend Your Own",
    "This is also why we do not have institutions like Solidarity or AfriForum, welfare and legal machines built by and for white communities, funded by wealthy white business networks who understand one thing we have yet to master: protect your own, fund your own, defend your own. Until we adopt that mindset, grounded in a Collective Coloured Consciousness, we will keep mistaking survival for progress, and individual success for collective liberation.",
    "We are the nation-builders who have kept believing, even while this country\u2019s political and economic systems have been captured, controlled, and dominated by both white and black elites. And while they fight each other for power, we are still fighting for recognition, for dignity, for space to exist fully.",
    "Let\u2019s Make It Plain",
    "The DA protects white power. It does not matter how many Coloured faces they put on posters. The party\u2019s core remains a safehouse for white privilege, where policy, money, and real influence stay locked in the hands of white executives. Here in the Western Cape, where Coloured people are the majority, and our voting power has won a province, we are not the decision-makers. We are the workers, the voters, the front, but never the core.",
    "The ANC protects black dominance. Coloured people are deliberately excluded from economic opportunities, policy benefits, and cultural recognition. We are denied employment equity. Denied land. Denied a place in the broader liberation story. And when we speak up, we are accused of being racist, ungrateful, or privileged, as if our own oppression were imaginary. Between these two giants, we are politically orphaned, economically trapped, culturally erased.",
    "Meanwhile, other groups, whether Afrikaners with their Orania, or black elites protected by cadre networks, are given the space to grow their power, their language, their economies. Even foreign nationals are doing better in our own communities than we are. That is not xenophobia. It is a hard truth.",
    "We remain the only group in South Africa without recorded generational wealth. We may know what millions look like, but not billions, because the structure has never allowed us to rise that far. The ceiling was fixed for us. The system never expected us to lead. Yet despite all this, we still believe. We still vote. We still build. We still forgive. We still hope for a South Africa that includes all of us. But hope without consciousness is a trap.",
    "Why the Coloured Conscious Must Rise",
    "That is why the Coloured Conscious must rise, not out of hate, not out of division, but out of a need to survive, to protect our identity, restore our reputation, and take our rightful place in this country\u2019s future. We are not asking for favours. We are demanding what is ours. We are done being politically neutralised and economically sidelined. We are not less sensitive to racism. We have just been taught to tolerate more pain. Now we are teaching ourselves to see clearly, speak boldly, and stand collectively.",
    "This is why a collective Coloured consciousness is not just timely. It is urgent. We need to see clearly. Speak boldly. Organise unapologetically. Reclaim our place. And stop allowing others to define us or use us.",
    "Chapter 17: The Covenant, A Closing Word",
    "This book began as a covenant, not with heaven, but with ourselves. Sixteen chapters later, that covenant is no longer just a phrase. It is a decision.",
    "We have named what broke us: the silence we were trained into, the shame we were sold, the votes we were harvested for, the culture we were told to hide, the land and labour we built and were never given a share of. But naming it was never the point. The point was always what comes next.",
    "So let this final chapter stand as the terms of the covenant, plainly stated.",
    "We will not wait to be defined. We already know what we are: not the leftovers of history, but its convergence. Not confusion, but a bridge. Not a demographic managed by whichever party remembers us every five years, but a people who write our own mandate.",
    "We will not raise another generation on apology. We will raise them on inheritance, language, music, memory, pride, and the plain fact that they were never a mistake.",
    "We will not beg for inclusion in economies we built with our own hands. We will build beside what we already have, and this time we will keep what we build.",
    "We will not outsource our story again, not to a party, not to a pulpit, not to a press that only finds us when we bleed. We are the narrators now.",
    "This is not the end of The Coloured Bible. It is the beginning of what it was written to start: a generation that does not flinch when it says \u201cI am Coloured,\u201d a people who no longer confuse survival with sovereignty, and a mind that has finally stopped asking for permission.",
    "We were forged, not formed. We were the evidence, not the accident. And from here, we are the authors.",
    "The covenant is signed, not in ink, but in how we live from this page forward.",
    "This is our new beginning. Let it be written."

  // ---------- Pagination ----------
  // Pages are filled with as many *complete* paragraphs as fit. A paragraph
  // is never split across a page boundary — it either fits on the current
  // page in full, or it starts the next page instead. That means a page can
  // occasionally end a little short of the bottom margin, but every
  // paragraph always reads as one continuous block, with its indent and
  // alignment applied consistently — no mid-sentence breaks, no partial
  // fragments. (An earlier version of this code split paragraphs across
  // pages to fill them more fully; that's what caused the broken gaps and
  // mixed-up indenting, so it's been removed in favor of this simpler,
  // reliable approach.)
  // The two heading rules are unchanged: a chapter heading always starts a
  // brand-new page, and an in-chapter subtitle is only placed on a page if
  // there's also room left for at least a few lines of body text under it —
  // otherwise it's pushed to the next page instead, so a subtitle never ends

  var MIN_TRAILING_AFTER_SUBTITLE = 70; // px

    if (isParaStart && isHeading(text)){

    } else if (isParaStart && isSubtitle(text)){
      cls = ' class="subtitle-heading"';
    } else {
      // No first-line indent when: this is the continuation of a paragraph
      // split across a page turn, or this is the first ordinary paragraph
      // right after a chapter heading / subtitle (standard book convention).
      var noIndent = !isParaStart;
      if (isParaStart && seg.idx > 0){
        var prevText = BOOK_BODY_PARAS[seg.idx - 1];
        if (isHeading(prevText) || isSubtitle(prevText)) noIndent = true;

  function paginate(){

    if (!pageObj) return "";
    if (pageObj.type === "title") return " title-page";
    if (pageObj.type === "end") return " end-page";
    return "";
  }

  // A "pair index" of 0 is the special opening spread: blank left, pages[0] alone
  // on the right (like a real book's title page). Every other pair index is an
  // odd number, showing pages[idx] on the left and pages[idx+1] on the right —
  // exactly like a real book, where turning a page reveals two brand-new pages.
  function getDisplayedPair(idx){
    var pages = state.pages;
    if (idx === 0) return { left: undefined, right: pages[0] };
    return { left: pages[idx], right: pages[idx + 1] };
  }

  function computeTarget(cur, direction, pageCount, total){
    var target;
    if (pageCount === 1){
      target = cur + direction;
    } else {
      if (direction === 1) target = (cur === 0) ? 1 : cur + 2;
      else target = (cur <= 1) ? 0 : cur - 2;
    }
    if (target < 0 || target >= total || target === cur) return null;
    return target;
  }

  // ---------- Read-aloud narration ----------
  var narration = { active: false };
  var narrateBtn = $("narrateBtn");

  function getPlainTextForPage(pageObj){
    if (!pageObj) return "";
    if (pageObj.type === "title"){
      var parts = [state.title];
      if (state.subtitle) parts.push(state.subtitle);
      if (state.author) parts.push("By " + state.author);
      return parts.join(". ");
    }
    if (pageObj.type === "end") return "The End.";
    return pageObj.segments.map(function(seg){
      var text = BOOK_BODY_PARAS[seg.idx];
      return seg.kind === "full" ? text : text.slice(seg.start, seg.end);
    }).join(". ");
  }

  function getActiveReadingPageObj(){
    if (state.pageCount === 1) return state.pages[state.current];
    var pair = getDisplayedPair(state.current);
    return pair.right;
  }

  function updateNarrationButton(){
    narrateBtn.innerHTML = narration.active ? "&#9209; Stop" : "&#128266; Read aloud";
    narrateBtn.classList.toggle("active", narration.active);
  }

  function stopNarration(){
    narration.active = false;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    updateNarrationButton();
  }

  // Web Speech API doesn't expose accent or gender directly — only whatever
  // voices the device/browser happens to have installed, each with a name
  // and a language tag. Until real voice cloning is wired up, this picks
  // the closest available match: prefer a South African English/Afrikaans
  // voice, and within that (or as a fallback across any English voice),
  // prefer one whose name suggests a male voice, using the common names
  // each platform (Chrome/Android, Edge/Windows, Safari/macOS) ships.
  function pickNarrationVoice(){
    if (!window.speechSynthesis) return null;
    var voices = window.speechSynthesis.getVoices() || [];
    if (!voices.length) return null;
    var savedURI = null;
    try { savedURI = localStorage.getItem(VOICE_PREF_KEY); } catch(e){}
    if (savedURI){
      var chosen = voices.filter(function(v){ return v.voiceURI === savedURI; })[0];
      if (chosen) return chosen;
    }
    var maleNames = ["male", "david", "daniel", "george", "james", "mark", "fred", "arthur", "oliver", "guy", "ryan", "thabo", "sipho", "will"];
    function score(v){
      var name = (v.name || "").toLowerCase();
      var lang = (v.lang || "").toLowerCase();
      var s = 0;
      if (lang === "en-za") s += 100;
      else if (lang === "af-za" || lang === "af") s += 90;
      else if (lang.indexOf("za") !== -1) s += 60;
      else if (lang.indexOf("en") === 0) s += 10;
      for (var i=0;i<maleNames.length;i++){
        if (name.indexOf(maleNames[i]) !== -1){ s += 20; break; }
      }
      return s;
    }
    var best = null, bestScore = -1;
    voices.forEach(function(v){
      var s = score(v);
      if (s > bestScore){ bestScore = s; best = v; }
    });
    return best;
  }

  function speakCurrentPage(){
    if (!window.speechSynthesis){
      narration.active = false;
      updateNarrationButton();
      return;
    }
    window.speechSynthesis.cancel();
    var text = getPlainTextForPage(getActiveReadingPageObj());
    if (!text){ stopNarration(); return; }
    var utt = new SpeechSynthesisUtterance(text);
    var savedPitch = null, savedRate = null;
    try {
      savedPitch = parseFloat(localStorage.getItem(PITCH_PREF_KEY));
      savedRate = parseFloat(localStorage.getItem(RATE_PREF_KEY));
    } catch(e){}
    utt.rate = (isFinite(savedRate) && savedRate) ? savedRate : 0.95; // calm, unhurried pace
    utt.pitch = (isFinite(savedPitch) && savedPitch) ? savedPitch : 1.0; // normal pitch by default; adjustable in Voice settings
    utt.lang = "en-ZA"; // hint only — falls back gracefully if unavailable
    var voice = pickNarrationVoice();
    if (voice) utt.voice = voice;
    utt.onend = function(){
      if (!narration.active) return;
      var t = computeTarget(state.current, 1, state.pageCount, state.pages.length);
      if (t === null){ stopNarration(); return; }
      // Advance silently (no flip animation) so continuous narration stays smooth.
      state.current = t;
      renderStatic();
      speakCurrentPage();
    };
    utt.onerror = function(){ stopNarration(); };
    window.speechSynthesis.speak(utt);
  }

  function toggleNarration(){
    if (narration.active){
      stopNarration();
    } else {
      narration.active = true;
      updateNarrationButton();
      speakCurrentPage();
    }
  }
  narrateBtn.addEventListener("click", toggleNarration);

  // ---------- Voice settings modal ----------
  var voiceSettingsBtn = $("voiceSettingsBtn");
  var voiceModalBackdrop = $("voiceModalBackdrop");
  var voiceSelect = $("voiceSelect");
  var pitchRange = $("pitchRange"), pitchValue = $("pitchValue");
  var rateRange = $("rateRange"), rateValue = $("rateValue");
  var voiceStatus = $("voiceStatus");

  function populateVoiceSelect(){
    if (!window.speechSynthesis) return;
    var voices = window.speechSynthesis.getVoices() || [];
    var savedURI = null;
    try { savedURI = localStorage.getItem(VOICE_PREF_KEY); } catch(e){}
    voiceSelect.innerHTML = "";
    var autoOpt = document.createElement("option");
    autoOpt.value = "";
    autoOpt.textContent = "Auto (best available male / South African voice)";
    voiceSelect.appendChild(autoOpt);
    voices.forEach(function(v){
      var opt = document.createElement("option");
      opt.value = v.voiceURI;
      opt.textContent = v.name + " (" + v.lang + ")";
      voiceSelect.appendChild(opt);
    });
    voiceSelect.value = savedURI || "";
    voiceStatus.textContent = voices.length ? "" :
      "No voices available yet \u2014 your browser may still be loading them. Give it a moment and reopen this.";
  }

  try {
  if (voiceSettingsBtn){
    voiceSettingsBtn.addEventListener("click", function(){
      if (narration.active) stopNarration();
      var savedPitch = null, savedRate = null;
      try {
        savedPitch = parseFloat(localStorage.getItem(PITCH_PREF_KEY));
        savedRate = parseFloat(localStorage.getItem(RATE_PREF_KEY));
      } catch(e){}
      pitchRange.value = (isFinite(savedPitch) && savedPitch) ? savedPitch : 1.0;
      rateRange.value = (isFinite(savedRate) && savedRate) ? savedRate : 0.95;
      pitchValue.textContent = parseFloat(pitchRange.value).toFixed(2);
      rateValue.textContent = parseFloat(rateRange.value).toFixed(2);
      populateVoiceSelect();
      voiceModalBackdrop.classList.add("open");
    });
    if (window.speechSynthesis){
      // Voice lists load asynchronously on first page load in some browsers.
      // Using the classic onX property (not addEventListener) here on purpose:
      // some mobile/WebView browsers don't fully implement EventTarget on the
      // speechSynthesis object, and calling addEventListener on it there throws
      // — which, unguarded, would stop this whole script partway through and
      // break pagination/rendering for the rest of the page, not just this
      // feature. The try/catch around this whole block is a second safety net
      // for the same reason.
      window.speechSynthesis.onvoiceschanged = function(){
        if (voiceModalBackdrop.classList.contains("open")) populateVoiceSelect();
      };
    }
    pitchRange.addEventListener("input", function(){ pitchValue.textContent = parseFloat(pitchRange.value).toFixed(2); });
    rateRange.addEventListener("input", function(){ rateValue.textContent = parseFloat(rateRange.value).toFixed(2); });
    $("cancelVoice").addEventListener("click", function(){ voiceModalBackdrop.classList.remove("open"); });
    $("saveVoice").addEventListener("click", function(){
      try {
        if (voiceSelect.value) localStorage.setItem(VOICE_PREF_KEY, voiceSelect.value);
        else localStorage.removeItem(VOICE_PREF_KEY);
        localStorage.setItem(PITCH_PREF_KEY, pitchRange.value);
        localStorage.setItem(RATE_PREF_KEY, rateRange.value);
      } catch(e){}
      voiceModalBackdrop.classList.remove("open");
    });
    voiceModalBackdrop.addEventListener("click", function(e){
      if (e.target === voiceModalBackdrop) voiceModalBackdrop.classList.remove("open");
    });
  }
  } catch(e){}

  // ---------- Render (static, no animation) ----------
  function renderStatic(){
    var pages = state.pages;
    var cur = state.current;

    if (state.pageCount === 1){
      var only = pages[cur];
      var m = pageMarkup(only);
      underContent.className = "page-content" + pageTypeClass(only);
      underContent.innerHTML = m.content;
      underFolio.textContent = m.folio;
      leftContent.innerHTML = "";
      leftFolio.textContent = "";
    } else {
      var pair = getDisplayedPair(cur);

      var l = pageMarkup(pair.left);
      leftContent.className = "page-content" + pageTypeClass(pair.left);
      leftContent.innerHTML = l.content;
      leftFolio.textContent = l.folio;

      var r = pageMarkup(pair.right);
      underContent.className = "page-content" + pageTypeClass(pair.right);
      underContent.innerHTML = r.content;
      underFolio.textContent = r.folio;
    }

    flipLeaf.classList.remove("animating");
    flipLeaf.style.transform = "rotateY(0deg)";
    flipLeaf.style.visibility = "hidden";
    frontContent.innerHTML = ""; backContent.innerHTML = "";
    frontFolio.textContent = ""; backFolio.textContent = "";

    updateChrome();
  }

  function updateChrome(){
    var total = state.pages.length;
    var cur = state.current;
    progressLabel.textContent = Math.min(cur + 1, total) + " / " + total;
    progressFill.style.width = (total > 1 ? (cur / (total - 1)) * 100 : 0) + "%";
    ribbon.style.right = (46 + (cur / Math.max(1, total - 1)) * 160) + "px";
    $("prevBtn").disabled = computeTarget(cur, -1, state.pageCount, total) === null;
    $("nextBtn").disabled = computeTarget(cur, 1, state.pageCount, total) === null;
    var announcer = $("pageAnnouncer");
    if (announcer) announcer.textContent = "Page " + Math.min(cur + 1, total) + " of " + total;
  }

  // ---------- Flip animation ----------
  function goNext(){ flip(1); }
  function goPrev(){ flip(-1); }

  function flip(direction){
    if (state.animating) return;
    var pages = state.pages;
    var cur = state.current;
    var target = computeTarget(cur, direction, state.pageCount, pages.length);
    if (target === null) return;

    if (narration.active) stopNarration();

    var osReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (osReducedMotion){
      state.current = target;
      renderStatic();
      return;
    }

    state.animating = true;
    flipLeaf.classList.remove("animating");
    flipLeaf.style.visibility = "visible";

    if (state.pageCount === 1){
      // Single page at a time: cur and target are always adjacent, so this is
      // a plain one-leaf flip between exactly those two pages.
      var L = Math.min(cur, target);
      var pageL = pages[L];
      var pageR = pages[L + 1];
      var mL = pageMarkup(pageL);
      var mR = pageMarkup(pageR);
      frontContent.className = "page-content" + pageTypeClass(pageL);
      frontContent.innerHTML = mL.content;
      frontFolio.textContent = mL.folio;
      backContent.className = "page-content" + pageTypeClass(pageR);
      backContent.innerHTML = mR.content;
      backFolio.textContent = mR.folio;

      var destObj = pages[target];
      var mDest = pageMarkup(destObj);
      underContent.className = "page-content" + pageTypeClass(destObj);
      underContent.innerHTML = mDest.content;
      underFolio.textContent = mDest.folio;
    } else {
      // Two-page spread: turning reveals a whole new pair, just like a real
      // book. The left page swaps instantly (no animation); the right page
      // is what visibly flips, from the old right page to the new one.
      var oldPair = getDisplayedPair(cur);
      var newPair = getDisplayedPair(target);

      var lm = pageMarkup(newPair.left);
      leftContent.className = "page-content" + pageTypeClass(newPair.left);
      leftContent.innerHTML = lm.content;
      leftFolio.textContent = lm.folio;

      var mFront = pageMarkup(oldPair.right);
      var mBack = pageMarkup(newPair.right);
      frontContent.className = "page-content" + pageTypeClass(oldPair.right);
      frontContent.innerHTML = mFront.content;
      frontFolio.textContent = mFront.folio;
      backContent.className = "page-content" + pageTypeClass(newPair.right);
      backContent.innerHTML = mBack.content;
      backFolio.textContent = mBack.folio;

      underContent.className = "page-content" + pageTypeClass(newPair.right);
      underContent.innerHTML = mBack.content;
      underFolio.textContent = mBack.folio;
    }

    if (direction === 1){
      flipLeaf.style.transform = "rotateY(0deg)";
      void flipLeaf.offsetWidth;
      flipLeaf.classList.add("animating");
      flipLeaf.style.transform = "rotateY(-180deg)";
    } else {
      flipLeaf.style.transform = "rotateY(-180deg)";
      void flipLeaf.offsetWidth;
      flipLeaf.classList.add("animating");
      flipLeaf.style.transform = "rotateY(0deg)";
    }

    var done = function(e){
      if (e && e.target !== flipLeaf) return;
      flipLeaf.removeEventListener("transitionend", done);
      state.current = target;
      state.animating = false;
      renderStatic();
    };
    flipLeaf.addEventListener("transitionend", done);
  }

  // ---------- Page-layout mode (1 page / 2 page) ----------
  function setPageCount(n){
    if (n !== state.pageCount){
      if (n === 1){
        // Switching to single-page: point at whichever page was the "active"
        // (right-hand) page of the current spread.
        state.current = (state.current === 0) ? 0 : state.current + 1;
      } else {
        // Switching to two-page: snap to the nearest valid pair-start index
        // (0, or the nearest odd number at/below the current single-page index).
        var s = state.current;
        state.current = (s <= 0) ? 0 : (s % 2 === 1 ? s : s - 1);
      }
    }
    state.pageCount = n;
    document.documentElement.style.setProperty("--page-count", n);
    leavesArea.classList.toggle("single-page-mode", n === 1);
    bookEl.classList.toggle("single-page-mode", n === 1);
    $("onePageBtn").classList.toggle("active", n === 1);
    $("twoPageBtn").classList.toggle("active", n === 2);
    $("onePageBtn").setAttribute("aria-pressed", n === 1 ? "true" : "false");
    $("twoPageBtn").setAttribute("aria-pressed", n === 2 ? "true" : "false");
    renderStatic();
    rescale();
  }
  $("onePageBtn").addEventListener("click", function(){ setPageCount(1); });
  $("twoPageBtn").addEventListener("click", function(){ setPageCount(2); });

  // ---------- Scaling to viewport ----------
  var stageEl = document.querySelector(".stage");

  function rescale(){
    var pageW = 440, pageH = 620;
    var bookW = pageW * state.pageCount + 56 + 56;
    var bookH = pageH + 48 + 80;
    var availW = window.innerWidth - 60;
    var availH = window.innerHeight - 120;
    var scale = Math.min(availW / bookW, availH / bookH, 1.1);
    state.fitScale = Math.max(0.35, scale);
    applyScale();
  }
  function applyScale(){
    var combined = state.fitScale * state.zoom;
    document.documentElement.style.setProperty("--scale", combined);
    stageEl.classList.toggle("zoomed", state.zoom > 1.001);
  }
  function setZoom(next){
    state.zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, next));
    applyScale();
    updateZoomChrome();
  }
  function updateZoomChrome(){
    $("zoomMinus").disabled = state.zoom <= ZOOM_MIN + 0.001;
    $("zoomPlus").disabled = state.zoom >= ZOOM_MAX - 0.001;
  }

  // ---------- Events ----------
  $("nextBtn").addEventListener("click", goNext);
  $("prevBtn").addEventListener("click", goPrev);
  function zoneClick(handler){
    return function(){
      if (window.getSelection().toString().length > 0) return;
      handler();
    };
  }
  $("zoneNext").addEventListener("click", zoneClick(goNext));
  $("zonePrev").addEventListener("click", zoneClick(goPrev));

  document.addEventListener("keydown", function(e){
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); goNext(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); goPrev(); }
  });

  window.addEventListener("resize", rescale);
  $("zoomMinus").addEventListener("click", function(){ setZoom(state.zoom - ZOOM_STEP); });
  $("zoomPlus").addEventListener("click", function(){ setZoom(state.zoom + ZOOM_STEP); });
  $("zoomReset").addEventListener("click", function(){ setZoom(1); stageEl.scrollTop = 0; stageEl.scrollLeft = 0; });
  stageEl.addEventListener("wheel", function(e){
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    setZoom(state.zoom + (e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP));
  }, { passive: false });

  // ---------- Cover gate (closed book) ----------
  var coverGate = $("coverGate");
  coverGate.addEventListener("click", function(){
    coverGate.style.display = "none";
  });

  // ---------- Load-a-book modal ----------
  var modalBackdrop = $("modalBackdrop");
  // Populated right after a successful .docx upload with each paragraph's
  // original Word style (heading / subtitle / body), in the same order as
  // the paragraphs dropped into the textarea. Used at "Open book" time to
  // carry chapter headings over instead of flattening the whole book into
  // plain body paragraphs. Cleared whenever the user edits the textarea by
  // hand, loads a plain .txt file, or reopens the modal, so it never gets
  // applied against text it no longer matches.
  var pendingDocxStructure = null;
  $("openLoad").addEventListener("click", function(){
    if (narration.active) stopNarration();
    $("titleInput").value = state.title;
    $("authorInput").value = state.author;
    setLoadStatus("", false);
    pendingDocxStructure = null;
    modalBackdrop.classList.add("open");
  });
  $("textInput").addEventListener("input", function(){ pendingDocxStructure = null; });
  $("cancelLoad").addEventListener("click", function(){ modalBackdrop.classList.remove("open"); });
  var loadStatus = $("loadStatus");
  function setLoadStatus(msg, isError){
    loadStatus.textContent = msg || "";
    loadStatus.classList.toggle("error", !!isError);
  }
  $("fileTrigger").addEventListener("click", function(){ $("fileInput").click(); });
  $("fileInput").addEventListener("change", function(e){
    var file = e.target.files[0];
    if (!file) return;
    var name = file.name || "";
    var isDocx = /\.docx$/i.test(name);
    setLoadStatus("Reading " + name + "\u2026", false);

    if (isDocx){
      if (!window.mammoth){
        setLoadStatus("Could not load the .docx reader (are you offline?). Try again, or paste the text instead.", true);
        return;
      }
      pendingDocxStructure = null;
      var reader = new FileReader();
      reader.onerror = function(){ setLoadStatus("Couldn't read that file. Try again, or paste the text instead.", true); };
      reader.onload = function(ev){
        // Convert to HTML rather than mammoth's plain "raw text" mode: this
        // gives us one <p>/<hN> per real Word paragraph, so we can rebuild
        // clean blank-line-separated paragraphs ourselves (instead of
        // trusting how mammoth joins raw text internally) AND remember which
        // paragraphs were styled as Word headings, so chapters can still
        // start on a fresh page with heading styling instead of collapsing
        // into one long stream of identical body paragraphs.
        window.mammoth.convertToHtml({ arrayBuffer: ev.target.result })
          .then(function(result){
            var doc = new DOMParser().parseFromString(result.value, "text/html");
            var blocks = doc.body.querySelectorAll("p, h1, h2, h3, h4, h5, h6, li");
            var paras = [];
            var structure = [];
            blocks.forEach(function(el){
              var t = el.textContent.replace(/\s+/g, " ").trim();
              if (!t) return;
              paras.push(t);
              var tag = el.tagName.toLowerCase();
              var kind = "body";
              if (tag === "h1" || tag === "h2") kind = "heading";
              else if (tag === "h3" || tag === "h4" || tag === "h5" || tag === "h6") kind = "subtitle";
              structure.push({ text: t, kind: kind });
            });
            if (!paras.length){
              setLoadStatus("That .docx file looks empty once the formatting is stripped out.", true);
              return;
            }
            pendingDocxStructure = structure;
            $("textInput").value = paras.join("\n\n");
            var headingCount = structure.filter(function(s){ return s.kind !== "body"; }).length;
            var structureNote = headingCount ? (" " + headingCount + " heading" + (headingCount === 1 ? "" : "s") + " detected and will carry over as chapter breaks.") : "";
            setLoadStatus(name + " loaded (" + paras.length + " paragraphs)." + structureNote + " Review the text below, then tap Open book.", false);
          })
          .catch(function(){
            setLoadStatus("Couldn't read that .docx file. It may be corrupted, password-protected, or a .doc (old format) file — try re-saving it as .docx, or paste the text instead.", true);
          });
      };
      reader.readAsArrayBuffer(file);
    } else {
      pendingDocxStructure = null;
      var txtReader = new FileReader();
      txtReader.onerror = function(){ setLoadStatus("Couldn't read that file. Try again, or paste the text instead.", true); };
      txtReader.onload = function(ev){
        $("textInput").value = ev.target.result;
        setLoadStatus(name + " loaded. Review the text below, then tap Open book.", false);
      };
      txtReader.readAsText(file);
    }
  });
  $("confirmLoad").addEventListener("click", function(){
    var text = $("textInput").value.trim();
    if (!text){ modalBackdrop.classList.remove("open"); return; }
    state.title = $("titleInput").value.trim() || "Untitled";
    state.author = $("authorInput").value.trim();
    $("brandTitle").textContent = state.title;
    // Loading custom text falls back to one paragraph per page (no heading
    // detection possible for arbitrary text), split on blank lines.
    var customParas = text.split(/\n\s*\n+/).map(function(s){ return s.trim(); }).filter(Boolean);
    BOOK_BODY_PARAS.length = 0;
    Array.prototype.push.apply(BOOK_BODY_PARAS, customParas);
    Object.keys(HEADINGS_SET).forEach(function(k){ delete HEADINGS_SET[k]; });
    Object.keys(SUBTITLES_SET).forEach(function(k){ delete SUBTITLES_SET[k]; });
    // If this text still exactly matches what came straight from a .docx
    // upload (i.e. the user didn't edit it afterwards), carry its Word
    // heading structure over so chapters still start on a new page and
    // read with heading styling, instead of every paragraph looking the same.
    if (pendingDocxStructure && pendingDocxStructure.length === customParas.length &&
        pendingDocxStructure.every(function(s, i){ return s.text === customParas[i]; })){
      pendingDocxStructure.forEach(function(s){
        if (s.kind === "heading") HEADINGS_SET[s.text] = true;
        else if (s.kind === "subtitle") SUBTITLES_SET[s.text] = true;
      });
    }
    state.current = 0;
    modalBackdrop.classList.remove("open");
    paginate();
    renderStatic();
  });
  modalBackdrop.addEventListener("click", function(e){
    if (e.target === modalBackdrop) modalBackdrop.classList.remove("open");
  });

  // ---------- Access gate ----------
  var lockScreen = $("lockScreen");
  var lockInput = $("lockInput");
  var lockError = $("lockError");
  var unlockBtn = $("unlockBtn");
  var lockDevNote = $("lockDevNote");
  $("lockBuyLink").href = BUY_PAGE_URL;

  function grantAccess(){ lockScreen.style.display = "none"; }

  function attemptUnlock(key){
    lockError.textContent = "";
    unlockBtn.disabled = true;
    unlockBtn.textContent = "Checking…";
    fetch(ACCESS_CHECK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ license_key: key })
    }).then(function(res){ return res.json(); })
      .then(function(data){
        unlockBtn.disabled = false;
        unlockBtn.textContent = "Unlock my book";
        if (data && data.valid){
          try { localStorage.setItem(STORAGE_KEY, key); } catch(e){}
          grantAccess();
        } else {
          lockError.textContent = "That key doesn't look right — check for typos, or use the key from your purchase email.";
        }
      })
      .catch(function(){
        unlockBtn.disabled = false;
        unlockBtn.textContent = "Unlock my book";
        lockError.textContent = "Couldn't reach the access check right now. Please try again in a moment.";
      });
  }
  unlockBtn.addEventListener("click", function(){
    var key = lockInput.value.trim();
    if (!key){ lockError.textContent = "Enter your access key first."; return; }
    attemptUnlock(key);
  });
  lockInput.addEventListener("keydown", function(e){ if (e.key === "Enter") unlockBtn.click(); });

  (function initGate(){
    if (DEV_MODE){
      lockDevNote.style.display = "block";
      lockDevNote.textContent = "Dev mode: no worker URL is set yet, so this screen isn't gating anything.";
      grantAccess();
      return;
    }
    var stored = null;
    try { stored = localStorage.getItem(STORAGE_KEY); } catch(e){}
    if (stored){ grantAccess(); return; }
    var urlKey = new URLSearchParams(window.location.search).get("key");
    if (urlKey){
      lockInput.value = urlKey;
      attemptUnlock(urlKey);
    }
  })();

  // ---------- Init ----------
  $("brandTitle").textContent = state.title;
  if (!window.speechSynthesis){ narrateBtn.style.display = "none"; if (voiceSettingsBtn) voiceSettingsBtn.style.display = "none"; }
  setPageCount(2);
  rescale();
  updateZoomChrome();

  // Wait for the actual book fonts to finish loading (and for the browser to
  // have actually painted with them, not just resolved the load promise)
  // before measuring pages. Pagination run too early, or against a font that
  // hasn't visually taken effect yet, locks in wrong measurements — this is
  // a known source of unreliable pagination, especially in mobile WebViews.
  loadingNote.style.display = "block";

  function runPaginationWhenReady(){
    function afterTwoFrames(cb){
      requestAnimationFrame(function(){ requestAnimationFrame(cb); });
    }
    afterTwoFrames(function(){
      paginate();
      renderStatic();
    });
  }

  if (document.fonts && document.fonts.load){
    Promise.all([
      document.fonts.load('400 15px "Libre Caslon Text"'),
      document.fonts.load('700 15px "Libre Caslon Text"'),
      document.fonts.load('italic 400 15px "Libre Caslon Text"')
    ]).catch(function(){ /* fall through even if a variant fails to load */ })
      .then(function(){
        if (document.fonts.ready){
          document.fonts.ready.then(runPaginationWhenReady);
        } else {
          runPaginationWhenReady();
        }
      });
  } else {
    runPaginationWhenReady();
  }

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
